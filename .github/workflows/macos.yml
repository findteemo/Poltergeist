# Builds the macOS .dmg — Tauri can't cross-compile from the Windows dev box,
# so a macOS runner is the only way to ship one. Windows installers are still
# built locally (see docs/ARCHITECTURE.md).
name: macOS build

on:
  # Not on tag push: this job merges the mac half into latest.json, so the
  # release (with the Windows manifest already on it) has to exist first.
  release:
    types: [published]
  workflow_dispatch: # build a dmg without touching any release

permissions:
  contents: write # for `gh release upload`

jobs:
  dmg:
    runs-on: macos-latest
    env:
      BUNDLE: src-tauri/target/universal-apple-darwin/release/bundle
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin # universal binary

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Signing key is required: tauri.conf.json has createUpdaterArtifacts +
      # a pubkey, so the build errors out without the matching private key.
      # It also produces the .app.tar.gz + .sig that mac auto-update needs.
      - uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: --target universal-apple-darwin # no tagName → build only, never touches the release

      - uses: actions/upload-artifact@v4
        with:
          name: poltergeist-macos
          path: |
            ${{ env.BUNDLE }}/dmg/*.dmg
            ${{ env.BUNDLE }}/macos/*.app.tar.gz*

      - name: Attach to the release + wire up mac auto-update
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          targz=$(ls "$BUNDLE"/macos/*.app.tar.gz)  # dmg = first install, tar.gz = updates
          gh release upload "$TAG" "$BUNDLE"/dmg/*.dmg "$targz" "$targz.sig" --clobber

          # latest.json is authored by the Windows release; merge the mac half in.
          # Both arch keys point at the same universal tarball — the updater looks
          # up "darwin-<arch>" exactly (updater.rs `target()`), no universal fallback.
          gh release download "$TAG" -p latest.json -O latest.json --clobber || {
            echo "::error::no latest.json on $TAG — publish the Windows manifest first, then re-run this workflow"
            exit 1
          }
          jq --arg sig "$(cat "$targz.sig")" \
             --arg url "https://github.com/$REPO/releases/download/$TAG/$(basename "$targz")" \
             '.platforms["darwin-aarch64"] = {signature: $sig, url: $url}
              | .platforms["darwin-x86_64"] = .platforms["darwin-aarch64"]' \
             latest.json > merged.json
          mv merged.json latest.json
          gh release upload "$TAG" latest.json --clobber
          echo "mac auto-update wired:"; jq -r '.platforms | keys[]' latest.json
