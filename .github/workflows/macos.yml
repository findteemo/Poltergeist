# Builds the macOS .dmg — Tauri can't cross-compile from the Windows dev box,
# so a macOS runner is the only way to ship one. Windows installers are still
# built locally (see docs/ARCHITECTURE.md).
#
# SECURITY: this job never sees the updater signing key. It builds unsigned and
# uploads the raw artifacts; the update payload is signed on the dev machine
# afterwards (`scripts/make_latest_json.js`). A key here would be usable by
# anyone who can run a workflow — and it can't be revoked, since the pubkey is
# baked into every installed copy. Every action is pinned to a commit SHA for
# the same reason: a moved tag is a code-execution path into the release build.
name: macOS build

on:
  release:
    types: [published]
  workflow_dispatch: # rebuild after a CI fix, or just get a dmg
    inputs:
      tag:
        description: "Attach the build to this existing release tag (blank = run artifacts only)"
        required: false
        default: ""

permissions:
  contents: write # for `gh release upload`

jobs:
  dmg:
    runs-on: macos-latest
    env:
      BUNDLE: src-tauri/target/universal-apple-darwin/release/bundle
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin # universal binary

      # No build cache: cached objects link straight into a binary users install.
      # A cold build costs ~10min on a release-only workflow — worth it.
      - name: Build (unsigned)
        working-directory: src-tauri
        run: |
          npx --yes @tauri-apps/cli@2.11.4 build --target universal-apple-darwin \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Pack the artifacts
        run: |
          set -euo pipefail
          app=$(ls -d "$BUNDLE"/macos/*.app)
          mkdir -p dist && cp "$BUNDLE"/dmg/*.dmg dist/
          # The update payload: same shape tauri-bundler makes — a gzip tar with
          # the .app at top level (install_inner strips the first path component).
          # COPYFILE_DISABLE stops bsdtar adding ._ AppleDouble entries.
          COPYFILE_DISABLE=1 tar -czf "dist/$(basename "$app").tar.gz" \
            -C "$BUNDLE/macos" "$(basename "$app")"
          ls -la dist/
          # Digests, into the log AND the run summary. Keeping the key off CI is
          # pointless if the dev then signs whatever bytes they happened to
          # download — the signature is the trust boundary, so there has to be
          # something to check the download against. The run page is the anchor:
          # it is tied to this commit and this workflow run, and unlike a release
          # asset nobody can quietly swap it afterwards.
          shasum -a 256 dist/* | tee dist/SHA256SUMS
          {
            echo "### Artifact digests"
            echo
            echo "Match these locally before signing anything — see docs/ARCHITECTURE.md."
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: poltergeist-macos
          path: dist/*

      - name: Attach to the release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/* --clobber
          echo "Now sign the tarball locally and publish latest.json — see docs/ARCHITECTURE.md."
