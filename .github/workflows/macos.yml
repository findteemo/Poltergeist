# Builds the macOS .dmg — Tauri can't cross-compile from the Windows dev box,
# so a macOS runner is the only way to ship one. Windows installers are still
# built locally (see docs/ARCHITECTURE.md).
name: macOS build

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # build a dmg without cutting a release

permissions:
  contents: write # for `gh release upload`

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin # universal binary

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Signing key is required: tauri.conf.json has createUpdaterArtifacts +
      # a pubkey, so the build errors out without the matching private key.
      - uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: --target universal-apple-darwin # no tagName → build only, never touches the release

      - uses: actions/upload-artifact@v4
        with:
          name: poltergeist-macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg --clobber \
            || echo "no release for $GITHUB_REF_NAME yet — download the dmg from this run's artifacts"
