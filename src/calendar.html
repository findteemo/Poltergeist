<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poltergeist · calendar</title>
  <link rel="stylesheet" href="tokens.css" />
  <script src="theme.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: transparent; overflow: hidden; font-family: var(--mono); }
    .panel {
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--void);
      border: 3px solid var(--purple);
      box-shadow: 4px 4px 0 0 var(--purple-deep), 0 0 14px rgb(var(--purple-rgb) / 0.35);
      color: var(--text);
      padding: 10px;
      background-image:
        radial-gradient(120% 80% at 0% 0%, rgb(var(--purple-rgb) / 0.10), transparent 55%),
        radial-gradient(120% 80% at 100% 100%, rgb(var(--purple-bright-rgb) / 0.08), transparent 55%);
    }
    .bar { display: flex; align-items: center; justify-content: space-between; cursor: grab; margin-bottom: 8px; }
    .bar:active { cursor: grabbing; }
    .title {
      font-size: 16px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase;
      color: var(--purple-bright);
      text-shadow: 2px 2px 0 var(--purple-deep), 0 0 12px rgb(var(--purple-rgb) / 0.5);
    }
    #close {
      border: 2px solid var(--purple-deep); background: var(--void); color: var(--purple);
      cursor: pointer; font-size: 12px; line-height: 1; padding: 2px 5px; font-family: var(--mono);
    }
    #close:hover { border-color: var(--danger); color: var(--danger-bright); }
    #close:focus-visible { outline: 2px solid var(--purple-bright); outline-offset: 2px; }
    #close, .nav { min-width: 24px; min-height: 24px; } /* WCAG 2.5.8 target minimum */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    /* month grid */
    .month { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .month .lbl { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--purple-bright); }
    .nav {
      border: 2px solid var(--purple-deep); background: var(--void); color: var(--purple);
      cursor: pointer; font-size: 11px; line-height: 1; padding: 2px 6px; font-family: var(--mono);
    }
    .nav:hover { border-color: var(--purple); color: var(--purple-bright); }
    .nav:focus-visible { outline: 2px solid var(--purple-bright); outline-offset: 2px; }
    .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 10px; }
    .dow { font-size: 9px; text-align: center; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    /* non-blank days are real <button>s (keyboard-operable); blanks stay inert divs */
    .cell {
      position: relative; aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-size: 10px; color: var(--text); background: var(--row);
      border: 1px solid transparent; cursor: pointer;
    }
    .cell.blank { background: transparent; cursor: default; }
    .cell:not(.blank):hover { border-color: var(--purple); }
    .cell:focus-visible { outline: 2px solid var(--purple-bright); outline-offset: -2px; }
    /* today is the anchor of the grid — make it unmistakable, not just brighter text */
    .cell.today {
      color: var(--purple-bright); font-weight: 700;
      border-color: var(--purple);
      box-shadow: inset 0 0 0 1px var(--purple), 0 0 10px rgb(var(--purple-bright-rgb) / 0.45);
    }
    .cell.sel { border-color: var(--purple-bright); background: var(--purple); color: var(--void); font-weight: 700; }
    .cell.sel.today { box-shadow: 0 0 12px rgb(var(--purple-bright-rgb) / 0.6); }
    .cell.has::after {
      content: ""; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
      width: 5px; height: 5px; background: var(--purple-bright); border-radius: 50%;
      box-shadow: 0 0 5px rgb(var(--purple-bright-rgb) / 0.7);
    }
    .cell.sel.has::after { background: var(--void); box-shadow: none; }

    /* agenda list */
    .agenda-head { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 6px; }
    #list { flex: 1; min-height: 0; overflow-y: auto; margin-right: -6px; padding-right: 6px; }
    #list::-webkit-scrollbar { width: 10px; }
    #list::-webkit-scrollbar-track { background: var(--void); }
    #list::-webkit-scrollbar-thumb { background: var(--purple-deep); border: 2px solid var(--void); }
    #list::-webkit-scrollbar-thumb:hover { background: var(--purple); }
    /* stronger day anchors give the agenda rhythm instead of a flat run of cards */
    .daygroup {
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px;
      color: var(--purple-bright); margin: 12px 0 5px; display: flex; align-items: center; gap: 6px;
    }
    .daygroup::before { content: ""; width: 10px; height: 10px; flex: none; background: var(--purple); }
    .daygroup:first-child { margin-top: 2px; }
    /* ledger lines — one list language shared with the settings reminder rows.
       the time leads each row as an aligned column */
    .item {
      display: flex; gap: 8px; align-items: baseline;
      background: transparent; border: none;
      border-bottom: 1px solid rgb(var(--purple-rgb) / 0.16);
      padding: 7px 4px; font-size: 11px; line-height: 1.4; word-break: break-word;
    }
    .item:last-child { border-bottom: none; }
    .item .time { flex: none; min-width: 46px; color: var(--purple-bright); font-size: 9px; font-weight: 700; letter-spacing: 1px; }
    .empty { color: var(--muted); font-size: 12px; text-align: center; margin-top: 18px; letter-spacing: 1px; line-height: 1.5; }
    .empty .sub { display: block; margin-top: 7px; font-size: 9px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.85; }
  </style>
</head>
<body>
  <main class="panel">
    <div class="bar">
      <h1 class="title">🗓 calendar</h1>
      <button id="close" title="hide" aria-label="Hide calendar">✕</button>
    </div>

    <div class="month">
      <button class="nav" id="prev" aria-label="Previous month">‹</button>
      <span class="lbl" id="mlabel"></span>
      <button class="nav" id="next" aria-label="Next month">›</button>
    </div>
    <div class="grid" id="grid"></div>

    <div class="agenda-head" id="ahead">next 7 days</div>
    <div id="list"></div>
  </main>
  <script src="winpos.js"></script>
  <script src="calendar.js"></script>
</body>
</html>
