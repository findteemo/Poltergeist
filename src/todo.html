<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poltergeist · to-do</title>
  <link rel="stylesheet" href="tokens.css" />
  <script src="theme.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: transparent; overflow: hidden; font-family: var(--mono); }
    .panel {
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--void);
      border: 3px solid var(--purple);
      box-shadow: 4px 4px 0 0 var(--purple-deep), 0 0 14px rgb(var(--purple-rgb) / 0.35);
      color: var(--text);
      padding: 10px;
      background-image:
        radial-gradient(120% 80% at 0% 0%, rgb(var(--purple-rgb) / 0.10), transparent 55%),
        radial-gradient(120% 80% at 100% 100%, rgb(var(--purple-bright-rgb) / 0.08), transparent 55%);
    }
    .bar { display: flex; align-items: center; justify-content: space-between; cursor: grab; margin-bottom: 8px; }
    .bar:active { cursor: grabbing; }
    .title {
      font-size: 16px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase;
      color: var(--purple-bright);
      text-shadow: 2px 2px 0 var(--purple-deep), 0 0 12px rgb(var(--purple-rgb) / 0.5);
    }
    #close {
      border: 2px solid var(--border); background: var(--void); color: var(--purple);
      cursor: pointer; font-size: 12px; line-height: 1; padding: 2px 5px; font-family: var(--mono);
    }
    #close:hover { border-color: var(--danger); color: var(--danger-bright); }
    #close:focus-visible { outline: 2px solid var(--purple-bright); outline-offset: 2px; }
    #close { min-width: 24px; min-height: 24px; } /* WCAG 2.5.8 target minimum */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
    #list { flex: 1; min-height: 0; overflow-y: auto; margin-right: -6px; padding-right: 6px; }
    #list::-webkit-scrollbar { width: 10px; }
    #list::-webkit-scrollbar-track { background: var(--void); }
    #list::-webkit-scrollbar-thumb { background: var(--purple-deep); border: 2px solid var(--void); }
    #list::-webkit-scrollbar-thumb:hover { background: var(--purple); }
    /* ledger lines — one list language shared with the settings reminder rows.
       real <button> so a task can be finished by keyboard, not just a click */
    .item {
      display: block; width: 100%; text-align: left;
      font-family: var(--mono); font-size: 12px; color: var(--text);
      background: transparent; border: none;
      border-bottom: 1px solid rgb(var(--purple-rgb) / 0.16);
      padding: 9px 6px; cursor: pointer; word-break: break-word;
      transition: background 0.12s ease, color 0.12s ease;
    }
    .item:last-child { border-bottom: none; }
    .item:hover, .item:focus-visible { background: rgb(var(--purple-rgb) / 0.06); color: var(--purple-bright); }
    .item:focus-visible { outline: 2px solid var(--purple-bright); outline-offset: -2px; }
    .item::before { content: "☐ "; color: var(--muted); }
    .item:hover::before, .item:focus-visible::before { content: "☑ "; color: var(--purple); }
    /* finishing grace: struck + fading for ~3s, click again to bring it back */
    .item.done { color: var(--muted); text-decoration: line-through; }
    .item.done::before, .item.done:hover::before { content: "☑ "; color: var(--purple); }
    .item.done .undo { float: right; color: var(--purple-bright); text-decoration: none; font-size: 10px; letter-spacing: 1px; }
    .empty { color: var(--muted); font-size: 12px; text-align: center; margin-top: 24px; letter-spacing: 1px; line-height: 1.5; }
    .empty .sub { display: block; margin-top: 7px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.85; }
    .hint { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; text-align: center; margin-top: 6px; }
  </style>
</head>
<body>
  <main class="panel">
    <div class="bar">
      <h1 class="title">✦ to-do</h1>
      <button id="close" title="hide" aria-label="Hide to-do list">✕</button>
    </div>
    <div id="list"></div>
    <div class="hint">click a task to finish it · click again to undo</div>
  </main>
  <script src="winpos.js"></script>
  <script src="todo.js"></script>
</body>
</html>
