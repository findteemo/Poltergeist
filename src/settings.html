<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poltergeist</title>
  <style>
    :root {
      --void: #0e0a14;
      --panel: #1b1230;
      --row: #221636;
      --purple: #9d7bd8;
      --purple-bright: #c4a6f5;
      --purple-deep: #3d2459;
      --text: #ddd0f5;
      --muted: #8d79b3;
      --mono: "Cascadia Code", "Consolas", "SF Mono", "Menlo", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      font-family: var(--mono);
      background: var(--void);
      color: var(--text);
      padding: 18px 16px;
      /* fill the window and lay out as a column so the list takes the slack */
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      /* faint spectral glow in the corners */
      background-image:
        radial-gradient(120% 80% at 0% 0%, rgba(157,123,216,0.10), transparent 55%),
        radial-gradient(120% 80% at 100% 100%, rgba(196,166,245,0.08), transparent 55%);
    }
    /* tabs fill the slack between the tabbar and the actions; only lists scroll */
    .tabs { flex: 1; min-height: 0; display: flex; }
    .tab { display: none; flex: 1; min-height: 0; flex-direction: column; width: 100%; }
    .tab.active { display: flex; }
    .scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden; /* rows shrink to fit; no sideways scroll */
      margin-right: -6px; /* let the scrollbar sit in the body padding */
      padding-right: 6px;
    }
    /* spectral scrollbar (WebView2 is Chromium) */
    .scroll::-webkit-scrollbar { width: 10px; }
    .scroll::-webkit-scrollbar-track { background: var(--void); }
    .scroll::-webkit-scrollbar-thumb {
      background: var(--purple-deep);
      border: 2px solid var(--void); /* inset so the thumb reads as a chunky pixel block */
    }
    .scroll::-webkit-scrollbar-thumb:hover { background: var(--purple); }
    /* tab bar */
    .tabbar { display: flex; gap: 6px; margin-bottom: 12px; }
    .tabbtn {
      flex: 1; border: 2px solid var(--purple-deep); background: var(--void);
      color: var(--muted); border-radius: 0; padding: 6px 4px; cursor: pointer;
      font-family: var(--mono); font-size: 10px; letter-spacing: 1px;
      text-transform: uppercase;
    }
    .tabbtn.active { color: var(--purple-bright); border-color: var(--purple); background: var(--row); }
    /* poltergeist (flame) per-row toggle */
    .pg {
      border: 2px solid var(--purple-deep); background: var(--void);
      border-radius: 0; cursor: pointer; font-size: 12px; line-height: 1; padding: 3px;
      filter: grayscale(1) opacity(0.45); /* off = dim */
    }
    .pg.on { filter: none; border-color: var(--purple); box-shadow: 0 0 8px rgba(196,166,245,0.6); }
    /* cry-timer + show-list rows reuse the size-row look */
    .opt input[type=number] {
      width: 54px; border: 2px solid var(--purple-deep); border-radius: 0;
      padding: 3px 4px; font-family: var(--mono); font-size: 11px;
      color: var(--text); background: var(--void);
    }
    .opt input[type=number]:focus { outline: none; border-color: var(--purple); }
    /* calendar tab: stacked label + full-width URL field, and a hint */
    .calfield {
      display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px;
      font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
    }
    .calfield input {
      border: 2px solid var(--purple-deep); border-radius: 0; padding: 6px 7px;
      font-family: var(--mono); font-size: 11px; color: var(--text); background: var(--void);
      text-transform: none; letter-spacing: 0;
    }
    .calfield input:focus { outline: none; border-color: var(--purple); }
    .calhint {
      font-size: 9px; color: var(--muted); letter-spacing: 0.3px; line-height: 1.5;
      margin: 6px 0 0; text-transform: none;
    }
    .calstatus { font-size: 10px; letter-spacing: 0.3px; margin: 8px 0 0; min-height: 13px; color: var(--purple-bright); }
    .calstatus.err { color: #e89; }
    /* frameless window: header doubles as the drag handle (no OS title bar) */
    .titlebar { display: flex; align-items: flex-start; justify-content: space-between; cursor: grab; }
    .titlebar:active { cursor: grabbing; }
    h1 {
      font-size: 15px; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; color: var(--purple-bright);
      text-shadow: 0 0 10px rgba(157,123,216,0.5);
    }
    #close {
      border: 2px solid var(--purple-deep); background: var(--void); color: var(--purple);
      border-radius: 0; cursor: pointer; font-size: 13px; line-height: 1; padding: 3px 6px;
      font-family: var(--mono);
    }
    #close:hover { border-color: #c77; color: #e89; }
    p.sub {
      font-size: 10px; color: var(--muted); margin: 5px 0 16px;
      letter-spacing: 0.5px;
    }
    .row {
      display: grid;
      /* minmax(0,1fr) lets the label shrink so the flame/delete never clip */
      grid-template-columns: 24px minmax(0, 1fr) auto auto 24px;
      gap: 9px;
      align-items: center;
      background: var(--row);
      border: 2px solid var(--purple-deep);
      border-radius: 0;
      padding: 9px;
      margin-bottom: 9px;
      box-shadow: 3px 3px 0 0 rgba(0,0,0,0.35);
    }
    .row input[type=text] {
      border: none; border-bottom: 1px solid rgba(157,123,216,0.22); /* reads as an editable field, not loose text */
      background: transparent; font-family: var(--mono);
      font-size: 12px; color: var(--text); padding-bottom: 2px;
      min-width: 0; /* allow the label cell to shrink instead of forcing overflow */
    }
    /* number + unit travel together as one control */
    .row > span { display: inline-flex; align-items: center; gap: 6px; }
    .row input[type=text]::placeholder { color: var(--muted); }
    .row input[type=number] {
      width: 48px; border: 2px solid var(--purple-deep); border-radius: 0;
      padding: 3px 4px; font-family: var(--mono); font-size: 11px;
      color: var(--text); background: var(--void);
    }
    .row select.unit {
      border: 2px solid var(--purple-deep); border-radius: 0;
      padding: 3px 2px; font-family: var(--mono); font-size: 10px;
      color: var(--text); background: var(--void); color-scheme: dark;
      text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
    }
    .row input[type=datetime-local] {
      border: 2px solid var(--purple-deep); border-radius: 0;
      padding: 3px 4px; font-family: var(--mono); font-size: 11px;
      color: var(--text); background: var(--void); color-scheme: dark;
    }
    .row input:focus { outline: none; border-color: var(--purple); }
    /* tinted checkbox */
    .row input[type=checkbox] { accent-color: var(--purple); width: 15px; height: 15px; }
    .del {
      border: 2px solid var(--purple-deep); background: var(--void); color: var(--purple);
      border-radius: 0; cursor: pointer; font-size: 12px; line-height: 1; padding: 3px;
      font-family: var(--mono);
    }
    .del:hover { border-color: #c77; color: #e89; }
    .mins { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .actions { display: flex; gap: 9px; margin-top: 14px; align-items: center; }
    button.primary, button.add, button.quit {
      border: 2px solid var(--purple); border-radius: 0; padding: 8px 12px;
      font-family: var(--mono); font-size: 12px; cursor: pointer;
      letter-spacing: 1px; text-transform: uppercase;
      box-shadow: 3px 3px 0 0 var(--purple-deep);
      transition: transform 0.06s ease, box-shadow 0.06s ease;
    }
    button:active { transform: translate(3px, 3px); box-shadow: 0 0 0 0 var(--purple-deep); }
    /* visible keyboard focus — text inputs already show focus via border-color */
    button:focus-visible, .tabbtn:focus-visible, .pg:focus-visible, .del:focus-visible {
      outline: 2px solid var(--purple-bright); outline-offset: 2px;
    }
    button.add { background: var(--panel); color: var(--purple-bright); margin-bottom: 2px; width: 100%; }
    button.primary { background: var(--purple); color: var(--void); flex: 1; font-weight: 700; }
    button.quit { background: var(--panel); color: var(--muted); border-color: var(--purple-deep); box-shadow: 3px 3px 0 0 #000; }
    .saved { font-size: 10px; color: var(--purple-bright); letter-spacing: 1px; text-transform: uppercase; }
    .sizerow {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
      font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
    }
    .sizerow input[type=range] { flex: 1; accent-color: var(--purple); }
    .sizerow input[type=checkbox] {
      margin-left: auto; accent-color: var(--purple); width: 15px; height: 15px; cursor: pointer;
    }
    /* a settled option row — divider + room set it apart from the list actions */
    .optrow {
      display: flex; align-items: center; gap: 10px;
      margin-top: 18px; padding-top: 16px;
      border-top: 2px solid var(--purple-deep);
      font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
    }
    .optrow label { cursor: pointer; }
    .optrow input[type=checkbox] {
      margin-left: auto; accent-color: var(--purple); width: 15px; height: 15px; cursor: pointer;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="titlebar" data-tauri-drag-region>
    <div data-tauri-drag-region>
      <h1 data-tauri-drag-region>✦ Poltergeist ✦</h1>
      <p class="sub" data-tauri-drag-region>gentle nudges from your little ghost · <span id="ver"></span></p>
    </div>
    <button id="close" title="close" aria-label="Close settings">✕</button>
  </div>

  <div class="tabbar">
    <button class="tabbtn active" data-tab="reminder">reminder</button>
    <button class="tabbtn" data-tab="todo">to-do</button>
    <button class="tabbtn" data-tab="calendar">calendar</button>
    <button class="tabbtn" data-tab="settings">settings</button>
  </div>

  <div class="tabs">
    <!-- REMINDER (default) -->
    <section class="tab active" id="tab-reminder">
      <div class="sizerow opt">
        <label for="cry">cry after</label>
        <input type="number" id="cry" min="1" max="10" step="1" />
        <span class="mins">min ignored</span>
      </div>
      <div id="list" class="scroll"></div>
      <button class="add" id="add">+ summon reminder</button>
      <button class="add" id="addSched">+ schedule for a time</button>
    </section>

    <!-- TO-DO -->
    <section class="tab" id="tab-todo">
      <div id="todolist" class="scroll"></div>
      <button class="add" id="addTodo">+ add task</button>
      <div class="optrow">
        <label for="todoVis">show list window</label>
        <input type="checkbox" id="todoVis" />
      </div>
    </section>

    <!-- CALENDAR (Google Calendar, read-only ICS feed) -->
    <section class="tab" id="tab-calendar">
      <label class="calfield">
        <span>google calendar ICS url</span>
        <input type="url" id="calUrl" placeholder="https://calendar.google.com/calendar/ical/.../basic.ics" aria-label="Google Calendar secret ICS URL" />
      </label>
      <div class="sizerow opt">
        <label for="calLead">nudge before</label>
        <input type="number" id="calLead" min="0" max="120" step="1" />
        <span class="mins">min</span>
      </div>
      <button class="add" id="calRefresh">↻ refresh now</button>
      <p class="calstatus" id="calStatus" role="status" aria-live="polite"></p>
      <p class="calhint">Google Calendar → Settings → your calendar → “Secret address in iCal format”. Read-only — nothing is written back.</p>
      <div class="optrow">
        <label for="calVis">show calendar window</label>
        <input type="checkbox" id="calVis" />
      </div>
    </section>

    <!-- SETTINGS -->
    <section class="tab" id="tab-settings">
      <div class="sizerow">
        <label for="size">ghost size</label>
        <input type="range" id="size" min="5" max="14" step="1" />
      </div>
      <div class="sizerow">
        <label for="chime">chime on nudge</label>
        <input type="checkbox" id="chime" />
      </div>
      <div class="sizerow">
        <label for="autostart">launch at login</label>
        <input type="checkbox" id="autostart" />
      </div>
    </section>
  </div>

  <div class="actions">
    <button class="primary" id="save">save</button>
    <button class="quit" id="quit">quit</button>
    <span class="saved" id="saved" role="status" aria-live="polite"></span>
  </div>
  <script src="winpos.js"></script>
  <script src="settings.js"></script>
</body>
</html>
