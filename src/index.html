<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>Poltergeist</title>
</head>
<body>
  <div id="stage">
    <div id="bubble" class="bubble" role="status" aria-live="polite"><span class="text"></span><span class="hint">click to dismiss</span></div>
    <div id="ghostwrap">
      <div id="flames" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <div id="char" class="char" data-tauri-drag-region role="button" aria-label="Poltergeist ghost — drag to move, right-click for settings" title="drag me · right-click for settings"></div>
      <div id="pad" class="pad" aria-hidden="true"></div>
    </div>
  </div>
  <script src="winpos.js"></script>
  <script src="main.js"></script>
</body>
</html>
