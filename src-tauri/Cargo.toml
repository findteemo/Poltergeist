[package]
name = "poltergeist"
version = "1.3.2"
edition = "2021"
description = "A cozy desktop reminder companion"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "rt", "macros"] }
dirs = "5"
tauri-plugin-updater = "2"
# Google Calendar (read-only ICS feed): blocking HTTPS + ICS parse + recurrence.
ureq = "2"
icalendar = "0.17"
rrule = "0.14"
chrono = "0.4"
chrono-tz = "0.10"
toml_edit = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

[profile.release]
panic = "abort"
strip = true
lto = true
opt-level = "s"
